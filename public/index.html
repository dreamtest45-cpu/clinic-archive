<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>أرشيف المرضى</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0E5F58">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS Safari doesn't read the manifest for "Add to Home Screen" — these tags give it a standalone (no browser chrome), correctly-named, correctly-iconed install. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أرشيف المرضى">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    direction:rtl;
    --bg:#F5F7F6; --surface:#FFFFFF; --surface-2:#EEF3F1; --ink:#16211F; --ink-muted:#5C6E69; --ink-faint:#93A29D;
    --primary:#0E5F58; --primary-dark:#0A3D38; --primary-tint:#E3F1EF; --accent:#C97A2B; --accent-tint:#FBEEE0;
    --border:#DCE4E1; --danger:#B5432F; --danger-tint:#FBEAE6; --success:#2F7D5A; --success-tint:#E7F4EC;
    --heading-accent:#0A3D38;
    --shadow:0 1px 2px rgba(20,30,28,.06), 0 10px 28px -14px rgba(20,30,28,.24);
    --radius:14px; --radius-sm:9px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1615; --surface:#16211F; --surface-2:#1C2825; --ink:#E7EEEC; --ink-muted:#95A5A0; --ink-faint:#5F716B;
      --primary:#57C4B6; --primary-dark:#3A9A8D; --primary-tint:#17322F; --accent:#E3A25C; --accent-tint:#2E2013;
      --border:#293733; --danger:#E27862; --danger-tint:#332019; --success:#6BC79A; --success-tint:#17301F;
      --heading-accent:#57C4B6; --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); direction:rtl; font-family:'Tajawal',-apple-system,'Segoe UI',Tahoma,sans-serif; font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'El Messiri','Tajawal',serif; font-weight:700; margin:0; text-wrap:balance; }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  input,select,textarea{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px; width:100%; outline:none; transition:border-color .15s; }
  input:focus,select:focus,textarea:focus{ border-color:var(--primary); }
  textarea{ resize:vertical; min-height:64px; }
  label{ display:block; font-size:12.5px; color:var(--ink-muted); margin-bottom:4px; font-weight:500; }
  .field{ margin-bottom:12px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .field-row{ grid-template-columns:1fr; } }
  button{ cursor:pointer; border:none; }
  .btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; font-weight:700; font-size:14px; white-space:nowrap; transition:transform .1s, opacity .15s, background .15s; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .btn-primary{ background:var(--accent); color:#2A1705; }
  .btn-primary:hover{ opacity:.92; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); }
  .btn-ghost:hover{ background:var(--border); }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--ink); }
  .btn-outline:hover{ background:var(--surface-2); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-danger-ghost{ background:transparent; border:1px solid var(--danger); color:var(--danger); }
  .btn-sm{ padding:6px 12px; font-size:13px; }
  .link-btn{ background:none; color:var(--primary); font-weight:700; font-size:13px; text-decoration:underline; text-underline-offset:3px; }

  .app{ max-width:1360px; margin:0 auto; padding:18px 22px 60px; min-height:100vh; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:44px; height:44px; border-radius:12px; background:var(--primary-tint); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .brand h1{ font-size:21px; color:var(--heading-accent); }
  .brand-sub{ margin:2px 0 0; font-size:12.5px; color:var(--ink-muted); }
  .topbar-actions{ display:flex; gap:10px; align-items:center; }

  .workspace{ display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
  @media (max-width:900px){ .workspace{ grid-template-columns:1fr; } }
  .patient-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; position:sticky; top:18px; }
  .panel-head{ padding:14px 14px 10px; border-bottom:1px solid var(--border); }
  .stat-row{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; font-size:12.5px; color:var(--ink-muted); }
  .patient-list{ max-height:calc(100vh - 210px); overflow-y:auto; padding:8px; }
  @media (max-width:900px){ .patient-list{ max-height:420px; } }
  .patient-card{ display:flex; flex-direction:column; gap:4px; padding:11px 12px; border-radius:var(--radius-sm); cursor:pointer; border:1px solid transparent; margin-bottom:4px; }
  .patient-card:hover{ background:var(--surface-2); }
  .patient-card.active{ background:var(--primary-tint); border-color:var(--primary); }
  .patient-card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .patient-name{ font-weight:700; font-size:14.5px; }
  .patient-meta{ font-size:12.5px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
  .badge{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .badge-warn{ background:var(--danger-tint); color:var(--danger); }
  .badge-muted{ background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--border); }
  .empty-list{ padding:26px 16px; text-align:center; color:var(--ink-muted); font-size:13.5px; }

  .detail-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); min-height:520px; padding:22px; }
  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:470px; gap:10px; color:var(--ink-muted); }
  .empty-state .empty-icon{ font-size:40px; margin-bottom:6px; }
  .empty-state h2{ font-size:19px; color:var(--ink); }
  .detail-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .detail-header h2{ font-size:23px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .detail-sub{ margin:6px 0 0; color:var(--ink-muted); font-size:13.5px; }
  .detail-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .tab-bar{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .tab-btn{ background:none; padding:10px 6px; margin-inline-start:18px; font-weight:700; color:var(--ink-muted); border-bottom:2px solid transparent; border-radius:0; }
  .tab-btn:first-child{ margin-inline-start:0; }
  .tab-btn.active{ color:var(--heading-accent); border-color:var(--accent); }

  .group-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:700px){ .group-grid{ grid-template-columns:1fr; } }
  .info-card{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; }
  .info-card h3{ font-size:13px; color:var(--ink-muted); font-family:'Tajawal'; font-weight:700; margin-bottom:10px; letter-spacing:.2px; }
  .info-row{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:13.5px; border-bottom:1px dashed var(--border); }
  .info-row:last-child{ border-bottom:none; }
  .info-row .k{ color:var(--ink-muted); flex:none; }
  .info-row .v{ text-align:left; font-weight:500; word-break:break-word; }
  .info-card.danger{ background:var(--danger-tint); border-color:transparent; }
  .info-card.danger h3{ color:var(--danger); }
  .note-block{ font-size:13.5px; white-space:pre-wrap; line-height:1.7; }
  .section-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .inline-form{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; margin-bottom:16px; }
  .form-actions{ display:flex; gap:8px; margin-top:6px; }
  .visit-card, .attach-card{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 15px; margin-bottom:10px; }
  .visit-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .visit-date{ font-weight:700; color:var(--heading-accent); font-variant-numeric:tabular-nums; }
  .visit-doctor{ font-size:12.5px; color:var(--ink-muted); }
  .visit-body{ margin-top:8px; display:grid; gap:6px; font-size:13.5px; }
  .visit-body .field-label{ color:var(--ink-muted); font-weight:700; font-size:12px; }
  .row-actions{ display:flex; gap:10px; margin-top:8px; }
  .attach-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .attach-card{ display:flex; flex-direction:column; gap:8px; }
  .attach-thumb{ width:100%; height:110px; border-radius:8px; object-fit:cover; background:var(--surface-2); border:1px solid var(--border); }
  .attach-thumb.file{ display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--ink-faint); }
  .attach-name{ font-size:12.5px; font-weight:600; word-break:break-word; }
  .attach-meta{ font-size:11px; color:var(--ink-muted); }
  .attach-actions{ display:flex; gap:8px; margin-top:auto; }
  .empty-tab{ text-align:center; color:var(--ink-muted); font-size:13.5px; padding:30px 10px; }
  .toast-root{ position:fixed; bottom:20px; inset-inline-start:20px; z-index:50; display:flex; flex-direction:column; gap:8px; }
  .toast{ background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:13px; font-weight:600; box-shadow:var(--shadow); animation:toastIn .2s ease; }
  .toast.err{ background:var(--danger); color:#fff; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  .confirm-box{ display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .confirm-box span{ color:var(--danger); font-weight:700; }

  .view-switch{ display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border); }
  .view-switch .tab-btn{ margin-inline-start:0; padding:8px 4px 10px; margin-inline-end:18px; }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .cal-title{ font-family:'El Messiri','Tajawal',serif; font-weight:700; font-size:19px; color:var(--heading-accent); }
  .cal-nav{ display:flex; gap:8px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:22px; }
  .cal-weekday{ text-align:center; font-size:12px; font-weight:700; color:var(--ink-muted); padding:2px 0 6px; }
  .cal-cell{ border:1px solid var(--border); border-radius:10px; min-height:84px; padding:6px; cursor:pointer; background:var(--surface); display:flex; flex-direction:column; gap:3px; transition:border-color .12s, background .12s; }
  .cal-cell:hover{ border-color:var(--primary); }
  .cal-cell.other-month{ opacity:.42; }
  .cal-cell.today .cal-daynum{ color:var(--accent); }
  .cal-cell.selected{ background:var(--primary-tint); border-color:var(--primary); }
  .cal-daynum{ font-weight:700; font-size:13px; font-variant-numeric:tabular-nums; }
  .cal-chip{ font-size:10.5px; background:var(--primary-tint); color:var(--heading-accent); border-radius:6px; padding:1px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-more{ font-size:10px; color:var(--ink-muted); }
  @media (max-width:760px){ .cal-grid{ gap:3px; } .cal-cell{ min-height:52px; padding:4px; } .cal-chip{ display:none; } .cal-daynum{ font-size:11.5px; } .cal-weekday{ font-size:10.5px; } }

  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:32px 28px; max-width:380px; width:100%; text-align:center; }
  .login-card .brand-mark{ margin:0 auto 14px; width:56px; height:56px; font-size:28px; }
  .login-card h1{ font-size:20px; color:var(--heading-accent); margin-bottom:4px; }
  .login-card p{ color:var(--ink-muted); font-size:13px; margin:0 0 20px; }
  .login-card form{ text-align:right; }
  .login-err{ color:var(--danger); font-size:13px; margin-top:8px; min-height:18px; }

  [hidden]{ display:none !important; }

  @media print{
    body{ background:#fff; }
    .topbar, .patient-panel, .tab-bar, .no-print{ display:none !important; }
    .workspace{ display:block; }
    .detail-panel{ box-shadow:none; border:none; padding:0; }
    .attach-grid{ display:none; }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">🗂️</div>
    <h1 id="loginClinicName">أرشيف المرضى</h1>
    <p>الدخول بكلمة مرور العيادة</p>
    <form id="loginForm">
      <div class="field"><label>كلمة المرور</label><input type="password" name="password" required autofocus></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">دخول</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <button id="installBtnLogin" class="btn btn-outline" style="width:100%;justify-content:center;margin-top:14px;" hidden>⬇ ثبّت التطبيق على هذا الجهاز</button>
    <p id="iosInstallHint" style="color:var(--ink-muted);font-size:12.5px;margin:12px 0 0;" hidden>لتثبيت التطبيق: اضغط زر المشاركة ⬆️ بالأسفل ثم "إضافة إلى الشاشة الرئيسية"</p>
  </div>
</div>

<div id="appRoot" hidden>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🗂️</div>
        <div>
          <h1 id="clinicNameHeading">أرشيف المرضى</h1>
          <p class="brand-sub">نظام إدارة سجلات المرضى والمواعيد</p>
        </div>
      </div>
      <div class="topbar-actions no-print">
        <button id="installBtnTop" class="btn btn-outline" hidden>⬇ تثبيت التطبيق</button>
        <a id="btnBackup" class="btn btn-outline" href="/api/export">⇩ نسخة احتياطية كاملة</a>
        <button id="btnNewPatient" class="btn btn-primary">+ مريض جديد</button>
        <button id="btnLogout" class="btn btn-ghost">خروج</button>
      </div>
    </header>

    <nav class="view-switch no-print" id="viewSwitch">
      <button class="tab-btn active" data-view="patients">🗂 المرضى</button>
      <button class="tab-btn" data-view="appointments">📅 المواعيد</button>
    </nav>

    <div class="workspace" id="patientsView">
      <aside class="patient-panel no-print">
        <div class="panel-head">
          <input id="searchInput" type="search" placeholder="ابحث بالاسم، الهاتف، أو الرقم الوطني…">
          <div class="stat-row">
            <span id="statLine">جارِ التحميل…</span>
            <button id="toggleArchived" class="link-btn">إظهار المؤرشفين</button>
          </div>
        </div>
        <div id="patientList" class="patient-list">
          <div class="empty-list">جارِ التحميل…</div>
        </div>
      </aside>

      <main class="detail-panel" id="detailPanel">
        <div class="empty-state">
          <div class="empty-icon">🗂️</div>
          <h2>اختر مريضًا من القائمة</h2>
          <p>أو أضف مريضًا جديدًا لبدء الأرشفة.</p>
        </div>
      </main>
    </div>

    <div class="detail-panel" id="appointmentsView" hidden></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script>
(function(){
  "use strict";

  // ---------- STATE ----------
  var patients = [];
  var patientsReady = false;
  var selectedId = null;
  var visits = [], attachments = [];
  var showArchived = false;
  var searchQuery = "";
  var activeTab = "overview";
  var overviewEditing = false;
  var visitFormOpen = false;
  var confirming = null;
  var uploading = false;
  var listPollTimer = null, detailPollTimer = null;

  // ---- appointments / calendar ----
  var currentView = 'patients'; // 'patients' | 'appointments'
  var appointments = [];
  var apptCalYear = new Date().getFullYear(), apptCalMonth = new Date().getMonth(); // 0-based month
  var selectedApptDay = todayStr();
  var apptFormOpen = false; // false | true (new) | {...appointment} (editing)
  var apptConfirmDeleteId = null;
  var clinicDisplayName = 'أرشيف المرضى'; // set from /api/me in checkSession()

  var patientListEl = document.getElementById('patientList');
  var detailPanelEl = document.getElementById('detailPanel');
  var statLineEl = document.getElementById('statLine');
  var toastRoot = document.getElementById('toastRoot');
  var modalRoot = document.getElementById('modalRoot');

  // ---------- HELPERS ----------
  function esc(s){
    if(s===undefined||s===null) return "";
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(d){
    if(!d) return "—";
    var parts = String(d).slice(0,10).split("-");
    if(parts.length!==3) return esc(d);
    return parts[2]+"/"+parts[1]+"/"+parts[0];
  }
  function calcAge(dob){
    if(!dob) return null;
    var b = new Date(dob); if(isNaN(b)) return null;
    var now = new Date();
    var age = now.getFullYear() - b.getFullYear();
    var m = now.getMonth() - b.getMonth();
    if(m<0 || (m===0 && now.getDate()<b.getDate())) age--;
    return age>=0 ? age : null;
  }
  function genderLabel(g){ return g==='male' ? 'ذكر' : g==='female' ? 'أنثى' : 'غير محدد'; }
  var ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  // Explicit day/month/year selects instead of <input type="date"> — some
  // Arabic-locale Android browsers show a Hijri calendar in native date
  // pickers, which silently stores the wrong Gregorian date.
  function dobSelectsHtml(iso){
    var d = '', m = '', y = '';
    if(iso){
      var parts = String(iso).slice(0,10).split('-');
      if(parts.length===3){ y = parseInt(parts[0],10); m = parseInt(parts[1],10); d = parseInt(parts[2],10); }
    }
    var i, days = '<option value="">يوم</option>';
    for(i=1;i<=31;i++){ days += '<option value="'+i+'"'+(d===i?' selected':'')+'>'+i+'</option>'; }
    var months = '<option value="">شهر</option>';
    for(i=1;i<=12;i++){ months += '<option value="'+i+'"'+(m===i?' selected':'')+'>'+ARABIC_MONTHS[i-1]+'</option>'; }
    var curY = new Date().getFullYear();
    var years = '<option value="">سنة</option>';
    for(i=curY;i>=curY-100;i--){ years += '<option value="'+i+'"'+(y===i?' selected':'')+'>'+i+'</option>'; }
    return '<div class="field-row" style="grid-template-columns:1fr 1.4fr 1fr;">' +
      '<select name="dob_day" required>'+days+'</select>' +
      '<select name="dob_month" required>'+months+'</select>' +
      '<select name="dob_year" required>'+years+'</select>' +
    '</div>';
  }
  function readDob(form){
    var d = form.elements.dob_day ? form.elements.dob_day.value : '';
    var m = form.elements.dob_month ? form.elements.dob_month.value : '';
    var y = form.elements.dob_year ? form.elements.dob_year.value : '';
    if(!d || !m || !y) return null;
    return y + '-' + ('0'+m).slice(-2) + '-' + ('0'+d).slice(-2);
  }
  function fmtSize(bytes){
    if(!bytes) return "";
    if(bytes < 1024) return bytes + " بايت";
    return Math.round(bytes/1024) + " ك.ب";
  }
  function toast(msg, isErr){
    var el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    toastRoot.appendChild(el);
    setTimeout(function(){ el.remove(); }, 3400);
  }
  function downloadTextFile(filename, text){
    var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  // ---------- WHATSAPP REMINDERS (manual, wa.me deep link — no API/account needed) ----------
  // Returns digits-only, international format (no "+", no leading zero) for
  // wa.me, or null if we can't tell what the number is.
  //  - Already international ("+9627...", "00962...") -> keep the country code, strip symbols.
  //  - Local Jordanian mobile (07XXXXXXXX) -> assume +962 and drop the leading 0.
  //  - Anything else (foreign patients registered with their own intl. number,
  //    or an unrecognized format) -> best-effort digits, no guessing at a country code.
  function waPhoneDigits(phone){
    if(!phone) return null;
    var raw = String(phone).trim();
    var digits = raw.replace(/\D/g, '');
    if(!digits) return null;
    if(raw.indexOf('+') === 0) return digits;
    if(digits.indexOf('00') === 0) return digits.slice(2);
    if(/^07\d{8}$/.test(digits)) return '962' + digits.slice(1);
    return digits;
  }
  function apptReminderMessage(a){
    var name = a.patient_name || 'عزيزي المريض';
    var when = fmtDate(a.date) + (a.time ? (' الساعة ' + a.time) : '');
    var doctorPart = a.doctor ? (' مع د. ' + a.doctor) : '';
    var clinicPart = clinicDisplayName ? (' في ' + clinicDisplayName) : '';
    return 'مرحباً ' + name + '،\nتذكير بموعدك يوم ' + when + doctorPart + clinicPart + '.\nبانتظارك 🌿';
  }
  function waReminderLink(a){
    var digits = waPhoneDigits(a.phone);
    if(!digits) return null;
    return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(apptReminderMessage(a));
  }

  // ---------- API ----------
  function api(method, url, body){
    var opts = { method: method, headers: {}, credentials: 'same-origin' };
    if(body !== undefined){
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function(r){
      if(r.status === 401){ showLogin(true); throw new Error('unauthorized'); }
      return r.json().catch(function(){ return {}; }).then(function(data){
        if(!r.ok){ var e = new Error(data.error || 'error'); e.status = r.status; e.data = data; throw e; }
        return data;
      });
    });
  }
  function apiErrMsg(err){
    if(err && err.data && err.data.error === 'too_many_attempts') return 'محاولات كثيرة، حاول بعد قليل';
    if(err && err.data && typeof err.data.error === 'string' && /مطلوب|مسموح|ملف/.test(err.data.error)) return err.data.error;
    return 'تعذر إتمام العملية، حاول مرة أخرى';
  }

  // ---------- AUTH / LOGIN ----------
  function showLogin(afterExpiry){
    stopPolling();
    document.getElementById('appRoot').hidden = true;
    document.getElementById('loginScreen').hidden = false;
    if(afterExpiry) document.getElementById('loginErr').textContent = 'انتهت الجلسة، سجّل الدخول من جديد';
  }
  function showApp(){
    document.getElementById('loginScreen').hidden = true;
    document.getElementById('appRoot').hidden = false;
    boot();
  }
  function checkSession(){
    fetch('/api/me', {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
      var name = d.clinicName || 'أرشيف المرضى';
      clinicDisplayName = name;
      document.getElementById('loginClinicName').textContent = name;
      document.getElementById('clinicNameHeading').textContent = name;
      document.title = name;
      if(d.authenticated) showApp(); else showLogin(false);
    }).catch(function(){ showLogin(false); });
  }
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = e.target.elements.password.value;
    var errEl = document.getElementById('loginErr');
    errEl.textContent = '';
    fetch('/api/login', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pw})
    }).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        if(res.ok){ e.target.reset(); showApp(); }
        else if(res.d.error === 'too_many_attempts') errEl.textContent = 'محاولات كثيرة، حاول بعد ١٥ دقيقة';
        else errEl.textContent = 'كلمة المرور غير صحيحة';
      }).catch(function(){ errEl.textContent = 'تعذر الاتصال بالخادم'; });
  });
  document.getElementById('btnLogout').addEventListener('click', function(){
    fetch('/api/logout', {method:'POST', credentials:'same-origin'}).finally(function(){ showLogin(false); });
  });

  // ---------- POLLING ----------
  function stopPolling(){
    if(listPollTimer){ clearInterval(listPollTimer); listPollTimer=null; }
    if(detailPollTimer){ clearInterval(detailPollTimer); detailPollTimer=null; }
  }
  // A background refresh must never blow away text the user is mid-typing
  // into an open form — re-rendering replaces that form's DOM entirely.
  function isFormOpen(){ return overviewEditing || visitFormOpen || apptFormOpen; }
  function startPolling(){
    stopPolling();
    listPollTimer = setInterval(function(){
      if(!isFormOpen()) loadPatients();
    }, 20000);
    detailPollTimer = setInterval(function(){
      if(selectedId && !isFormOpen()) loadVisitsAndAttachments(selectedId, true);
    }, 15000);
  }

  // ---------- DATA LOADING ----------
  function boot(){
    currentView = 'patients'; renderViewSwitch();
    var pv = document.getElementById('patientsView'), av = document.getElementById('appointmentsView');
    if(pv) pv.hidden = false;
    if(av) av.hidden = true;
    loadPatients();
    startPolling();
  }
  function loadPatients(){
    return api('GET', '/api/patients').then(function(rows){
      patients = rows;
      patientsReady = true;
      renderPatientList();
      renderDetail();
    }).catch(function(err){
      if(err.message === 'unauthorized') return;
      patientListEl.innerHTML = '<div class="empty-list">تعذر تحميل قائمة المرضى</div>';
    });
  }
  function loadVisitsAndAttachments(id, silent){
    return Promise.all([
      api('GET', '/api/patients/'+id+'/visits'),
      api('GET', '/api/patients/'+id+'/attachments')
    ]).then(function(res){
      if(selectedId !== id) return;
      visits = res[0]; attachments = res[1];
      renderDetail();
    }).catch(function(err){
      if(!silent && err.message !== 'unauthorized') toast('تعذر تحميل بيانات المريض', true);
    });
  }

  // ---------- PATIENT LIST ----------
  function filteredPatients(){
    var q = searchQuery.trim().toLowerCase();
    return patients.filter(function(p){
      if(!showArchived && p.archived) return false;
      if(showArchived && !p.archived) return false;
      if(!q) return true;
      var hay = [p.name,p.phone,p.phone2,p.national_id].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  function renderPatientList(){
    var activeCount = patients.filter(function(p){ return !p.archived; }).length;
    var archivedCount = patients.length - activeCount;
    statLineEl.textContent = activeCount + " مريض نشط" + (archivedCount ? " · " + archivedCount + " مؤرشف" : "");
    document.getElementById('toggleArchived').textContent = showArchived ? "إظهار النشطين" : "إظهار المؤرشفين ("+archivedCount+")";
    var list = filteredPatients();
    if(list.length === 0){
      patientListEl.innerHTML = '<div class="empty-list">' +
        (patients.length===0 ? 'لا يوجد مرضى بعد. اضغط "مريض جديد" للبدء.' : 'لا توجد نتائج مطابقة.') + '</div>';
      return;
    }
    patientListEl.innerHTML = list.map(function(p){
      var age = calcAge(p.dob);
      var hasAllergy = p.allergies && p.allergies.trim();
      return '<div class="patient-card'+(p.id===selectedId?' active':'')+'" data-select="'+p.id+'">' +
        '<div class="patient-card-top">' +
          '<span class="patient-name">'+esc(p.name||'بدون اسم')+'</span>' +
          (hasAllergy ? '<span class="badge badge-warn">⚠ حساسية</span>' : '') +
        '</div>' +
        '<span class="patient-meta">'+esc(p.phone||'—')+(age!==null?' · '+age+' سنة':'')+'</span>' +
        (p.archived ? '<span class="badge badge-muted" style="align-self:flex-start;margin-top:2px;">مؤرشف</span>' : '') +
      '</div>';
    }).join('');

  // ---------- APPOINTMENTS / CALENDAR ----------
  var WEEKDAY_LABELS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var APPT_STATUS_LABELS = { scheduled:'مجدول', done:'مكتمل', cancelled:'ملغى', no_show:'لم يحضر' };

  function pad2(n){ return (n<10?'0':'') + n; }
  function isoOf(y,m,d){ return y + '-' + pad2(m+1) + '-' + pad2(d); }
  function calGridRange(){
    var first = new Date(apptCalYear, apptCalMonth, 1);
    var gridStart = new Date(apptCalYear, apptCalMonth, 1 - first.getDay());
    var dates = [];
    for(var i=0;i<42;i++){ dates.push(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i)); }
    return dates;
  }
  function loadAppointmentsForVisibleMonth(){
    var dates = calGridRange();
    var from = isoOf(dates[0].getFullYear(), dates[0].getMonth(), dates[0].getDate());
    var to = isoOf(dates[41].getFullYear(), dates[41].getMonth(), dates[41].getDate());
    return api('GET', '/api/appointments?from='+from+'&to='+to).then(function(rows){
      appointments = rows;
      renderAppointmentsView();
    }).catch(function(err){ if(err.message!=='unauthorized') toast('تعذر تحميل المواعيد', true); });
  }
  function renderAppointmentsView(){
    var el = document.getElementById('appointmentsView');
    if(!el || currentView!=='appointments') return;
    var html = '<div class="cal-header no-print">' +
      '<div class="cal-title">'+ARABIC_MONTHS[apptCalMonth]+' '+apptCalYear+'</div>' +
      '<div class="cal-nav">' +
        '<button class="btn btn-outline btn-sm" data-action="cal-prev">‹ السابق</button>' +
        '<button class="btn btn-outline btn-sm" data-action="cal-today">اليوم</button>' +
        '<button class="btn btn-outline btn-sm" data-action="cal-next">التالي ›</button>' +
      '</div></div>';
    html += '<div class="cal-grid no-print">';
    WEEKDAY_LABELS.forEach(function(w){ html += '<div class="cal-weekday">'+w+'</div>'; });
    var today = todayStr();
    calGridRange().forEach(function(dt){
      var iso = isoOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
      var inMonth = dt.getMonth() === apptCalMonth;
      var dayAppts = appointments.filter(function(a){ return a.date === iso; });
      var cls = 'cal-cell' + (inMonth?'':' other-month') + (iso===today?' today':'') + (iso===selectedApptDay?' selected':'');
      html += '<div class="'+cls+'" data-day="'+iso+'">';
      html += '<span class="cal-daynum">'+dt.getDate()+'</span>';
      dayAppts.slice(0,3).forEach(function(a){
        html += '<span class="cal-chip">'+esc(a.time||'')+' '+esc(a.patient_name||'')+'</span>';
      });
      if(dayAppts.length>3){ html += '<span class="cal-more">+'+(dayAppts.length-3)+' أخرى</span>'; }
      html += '</div>';
    });
    html += '</div>';
    html += renderApptDayPanel();
    el.innerHTML = html;
  }
  function renderApptDayPanel(){
    var dayAppts = appointments.filter(function(a){ return a.date === selectedApptDay; })

  // ---------- IMAGE COMPRESSION (client-side, keeps storage lean) ----------
  function compressImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read_failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode_failed')); };
        img.onload = function(){
          var maxDim = 1600, q = 0.82;
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w,h));
          var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error('encode_failed')); return; }
            resolve(blob);
          }, 'image/jpeg', q);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function handleUpload(){
    var input = document.getElementById('attachInput');
    var noteEl = document.getElementById('attachNote');
    if(!input || !input.files || !input.files[0]){ toast('اختر ملفًا أولًا', true); return; }
    var file = input.files[0];
    var note = noteEl ? noteEl.value.trim() : "";
    var isImage = file.type.indexOf('image/') === 0;
    uploading = true; renderDetail();
    var p = isImage ? compressImage(file) : Promise.resolve(file);
    p.then(function(blob){
      var outName = file.name || 'مرفق';
      if(isImage){ outName = outName.replace(/\.[^.]+$/, '') + '.jpg'; }
      var fd = new FormData();
      fd.append('file', blob, outName);
      if(note) fd.append('note', note);
      return fetch('/api/patients/'+selectedId+'/attachments', { method:'POST', credentials:'same-origin', body: fd });
    }).then(function(r){
      if(r.status === 401){ showLogin(true); throw new Error('unauthorized'); }
      return r.json().then(function(d){ if(!r.ok) throw Object.assign(new Error(d.error||'error'), {data:d}); return d; });
    }).then(function(created){
      toast('تم رفع المرفق');
      attachments = [created].concat(attachments);
    }).catch(function(err){
      if(err.message !== 'unauthorized') toast(apiErrMsg(err), true);
    }).finally(function(){
      uploading = false; renderDetail();
    });
  }

  document.addEventListener('click', function(e){
    var selCard = e.target.closest('[data-select]');
    if(selCard){ selectPatient(selCard.getAttribute('data-select')); return; }

    var dayCell = e.target.closest('[data-day]');
    if(dayCell){
      selectedApptDay = dayCell.getAttribute('data-day');
      apptFormOpen = false; apptConfirmDeleteId = null;
      renderAppointmentsView();
      return;
    }

    var t = e.target.closest('[data-action], [data-tab], [data-view]');
    if(!t){
      if(e.target.id === 'btnNewPatient'){ openNewPatientModal(); return; }
      if(e.target.closest('.modal-overlay') === e.target){ closeModal(); return; }
      if(e.target.id === 'toggleArchived'){ showArchived = !showArchived; renderPatientList(); return; }
      return;
    }
    if(t.hasAttribute('data-view')){ switchView(t.getAttribute('data-view')); return; }
    if(t.hasAttribute('data-tab')){
      activeTab = t.getAttribute('data-tab');
      overviewEditing = false; visitFormOpen = false; confirming = null;
      renderDetail();
      return;
    }
    var action = t.getAttribute('data-action');
    var id = t.getAttribute('data-id');
    switch(action){
      case 'edit-overview': overviewEditing = true; renderDetail(); break;
      case 'cancel-edit': overviewEditing = false; renderDetail(); break;
      case 'toggle-visit-form': visitFormOpen = !visitFormOpen; renderDetail(); break;
      case 'toggle-archive':
        if(selectedId){
          var p = currentPatient();
          api('PATCH', '/api/patients/'+selectedId+'/archive', {archived: !p.archived}).then(function(updated){
            toast(updated.archived ? 'تم أرشفة المريض' : 'تم إلغاء الأرشفة');
            patients = patients.map(function(x){ return x.id===updated.id ? updated : x; });

          }).catch(function(err){ if(err.message!=='unauthorized') toast(apiErrMsg(err), true); });
        }
        break;
      case 'delete-patient': confirming = {type:'patient', id:selectedId}; renderDetail(); break;
      case 'confirm-delete-patient':
        if(selectedId){
          var delId = selectedId;
          api('DELETE', '/api/patients/'+delId).then(function(){
            toast('تم حذف المريض نهائيًا');
            patients = patients.filter(function(x){ return x.id !== delId; });
            selectedId = null; confirming = null;
            renderPatientList(); renderDetail();
          }).catch(function(err){ if(err.message!=='unauthorized') toast(apiErrMsg(err), true); });
        }
        break;
      case 'cancel-confirm': confirming = null; renderDetail(); break;
      case 'edit-visit':
        var foundVisit = visits.find(function(x){ return x.id===id; });
        if(foundVisit){ visitFormOpen = foundVisit; renderDetail(); }
        break;
      case 'delete-visit': confirming = {type:'visit', id:id}; renderDetail(); break;
      case 'confirm-delete-visit':
        if(selectedId){
          api('DELETE', '/api/patients/'+selectedId+'/visits/'+id).then(function(){
            confirming=null; toast('تم حذف الزيارة');
            visits = visits.filter(function(v){ return v.id !== id; });
            renderDetail();
          }).catch(function(err){ if(err.message!=='unauthorized') toast(apiErrMsg(err), true); });
        }
        break;
      case 'delete-attachment': confirming = {type:'attachment', id:id}; renderDetail(); break;
      case 'confirm-delete-attachment':
        if(selectedId){
          api('DELETE', '/api/patients/'+selectedId+'/attachments/'+id).then(function(){
            confirming=null; toast('تم حذف المرفق');
            attachments = attachments.filter(function(a){ return a.id !== id; });
            renderDetail();
          }).catch(function(err){ if(err.message!=='unauthorized') toast(apiErrMsg(err), true); });
        }
        break;
      case 'upload-attachment': handleUpload(); break;
      case 'export-patient': doExportPatientText(); break;
      case 'print': window.print(); break;
      case 'close-modal': closeModal(); break;
      case 'cal-prev':
        apptCalMonth--; if(apptCalMonth<0){ apptCalMonth=11; apptCalYear--; }
        loadAppointmentsForVisibleMonth();
        break;
      case 'cal-next':
        apptCalMonth++; if(apptCalMonth>11){ apptCalMonth=0; apptCalYear++; }
        loadAppointmentsForVisibleMonth();
        break;
      case 'cal-today':
        var now = new Date(); apptCalYear = now.getFullYear(); apptCalMonth = now.getMonth(); selectedApptDay = todayStr();
        loadAppointmentsForVisibleMonth();
        break;
      case 'appt-new': apptFormOpen = true; renderAppointmentsView(); break;
      case 'appt-close-form': apptFormOpen = false; renderAppointmentsView(); break;
      case 'appt-edit':
        var foundAppt = appointments.find(function(a){ return a.id===id; });
        if(foundAppt){ apptFormOpen = foundAppt; renderAppointmentsView(); }
        break;
      case 'appt-mark':
        var newStatus = t.getAttribute('data-status');
        api('PATCH', '/api/appointments/'+id, {status:newStatus}).then(function(saved){
          appointments = appointments.map(function(a){ return a.id===saved.id ? saved : a; });
          toast('تم تحديث حالة الموعد');
          renderAppointmentsView();
        }).catch(function(err){ if(err.message!=='unauthorized') toast(apiErrMsg(err), true); });
        break;
      case 'appt-delete': apptConfirmDeleteId = id; renderAppointmentsView(); break;
      case 'appt-cancel-confirm': apptConfirmDeleteId = null; renderAppointmentsView(); break;
      case 'appt-confirm-delete':
        api('DELETE', '/api/appointments/'+id).then(function(){
          appointments = appointments.filter(function(a){ return a.id !== id; });
          apptConfirmDeleteId = null;
          toast('تم حذف الموعد');
          renderAppointmentsView();
        }).catch(function(err){ if(err.message!=='unauthorized') toast(apiErrMsg(err), true); });
        break;
      case 'appt-goto-patient':
        switchView('patients');
        selectPatient(id);
        break;
    }
  });

  document.getElementById('searchInput').addEventListener('input', function(e){
    searchQuery = e.target.value;
    renderPatientList();
  });

  document.addEventListener('change', function(e){
    if(e.target.id === 'visitHasInsurance'){
      var f = document.getElementById('visitInsuranceCompanyField');
      if(f) f.hidden = !e.target.checked;
    }
  });

  // ---------- PWA: service worker + "install app" prompt ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    });
  }
  var deferredInstallPrompt = null;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var installBtnLogin = document.getElementById('installBtnLogin');
  var installBtnTop = document.getElementById('installBtnTop');
  var iosInstallHint = document.getElementById('iosInstallHint');

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    if(!isStandalone){ installBtnLogin.hidden = false; installBtnTop.hidden = false; }
  });
  function triggerInstall(){
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      installBtnLogin.hidden = true; installBtnTop.hidden = true;
    });
  }
  installBtnLogin.addEventListener('click', triggerInstall);
  installBtnTop.addEventListener('click', triggerInstall);
  window.addEventListener('appinstalled', function(){
    installBtnLogin.hidden = true; installBtnTop.hidden = true;
    toast('تم تثبيت التطبيق');
  });
  // Chrome/Android fires beforeinstallprompt on its own; iOS Safari never
  // does, so show a manual hint there instead (only when not already installed).
  if(isIOS && !isStandalone){ iosInstallHint.hidden = false; }

  checkSession();
})();
</script>
</body>
</html>
